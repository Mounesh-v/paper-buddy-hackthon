spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://scholaros-db:5432/scholaros}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.scholaros.homework: ${LOG_LEVEL_APP:INFO}

spring:
  application:
    name: ${APP_NAME:scholaros-homework-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: always

scholaros:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:mock}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpc2lzYXNlY3JldGtleWZvcmp3dGF1dGhlbnRpY2F0aW9uaW5zY2hvbGFyb3NhcHBsaWNhdGlvbg==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,prometheus}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${SHOW_HEALTH_DETAILS:when_authorized}
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.scholaros.homework: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
